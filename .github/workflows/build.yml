name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # 🔥 KRİTİK ADIM: sdkmanager yolunu düzelt ve lisansları kabul et
      - name: Fix sdkmanager path and accept licenses
        run: |
          # Buildozer'ın SDK dizinini tanımla
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          
          # cmdline-tools/latest/bin altındaki sdkmanager'ı tools/bin'e kopyala
          # (Buildozer hala eski yolu aradığı için)
          mkdir -p $ANDROID_SDK_ROOT/tools/bin
          if [ -f $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager ]; then
            cp $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $ANDROID_SDK_ROOT/tools/bin/
            cp -r $ANDROID_SDK_ROOT/cmdline-tools/latest/lib $ANDROID_SDK_ROOT/tools/ 2>/dev/null || true
          fi
          
          # Lisansları güvenli bir şekilde kabul et (yes | yerine printf kullan)
          printf 'y\ny\ny\ny\ny\ny\ny\ny\n' | $ANDROID_SDK_ROOT/tools/bin/sdkmanager --licenses || true
          
          # Gerekli build-tools paketini kur
          printf 'y\n' | $ANDROID_SDK_ROOT/tools/bin/sdkmanager "build-tools;33.0.0" || true

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      # Buildozer'ı çalıştırırken 'yes |' KULLANMA, doğrudan çalıştır
      # (Lisanslar zaten yukarıda kabul edildi)
      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pybrowser-mobile-apk
          path: bin/*.apk
          retention-days: 30
